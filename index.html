<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davelyn's Debut Invitation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f3;
            color: #5c4033;
            text-align: center;
        }
        .envelope-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffccd5, #ffb3c1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .invitation-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
        }
        h1 {
            font-family: 'Georgia', serif;
            color: #b76e79;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #666;
        }
        .open-btn {
            background-color: #b76e79;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(183, 110, 121, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .open-btn:hover {
            background-color: #a35d68;
            transform: scale(1.05);
        }
        .main-content {
            padding: 50px 20px;
            display: none;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Opening Overlay with Envelope Button -->
    <div id="envelopeOverlay" class="envelope-overlay">
        <div class="invitation-card">
            <h1>You're invited!</h1>
            <p>Step into 18 with Davelyn<br>October 18, 2026</p>
            <button class="open-btn" onclick="openInvitation()">Open Invitation</button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="main-content">
        <h1>Davelyn's Debut</h1>
        <p>Join us in celebrating this milestone on <strong>October 18, 2026</strong>.</p>
        <p>✨ Welcome to my celebration! ✨</p>
    </div>

    <!-- Background Audio -->
    <audio id="bgMusic" loop>
        <source src="https://ia801400.us.archive.org/22/items/liszt-piano-music-o-orchestral-works-o-concertos-o-choral-works-o-lieder-by-vari_20240617_1444/%2803%29%20Liszt%20-%20Liebestr%C3%A4ume%2C%20S.%20541%20-%20No.%203%20in%20A-flat%20major%20%E2%80%9COh%20Lieb%2C%20so%20lang%20du%20lieben%20kannst%E2%80%9D.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        function openInvitation() {
            var music = document.getElementById('bgMusic');
            music.play().catch(function(error) {
                console.log("Audio play failed:", error);
            });
            
            var overlay = document.getElementById('envelopeOverlay');
            var content = document.getElementById('mainContent');
            
            overlay.classList.add('hidden');
            content.style.display = 'block';
            
            setTimeout(function() {
                overlay.style.display = 'none';
            }, 800);
        }
    </script>
</body>
</html>
